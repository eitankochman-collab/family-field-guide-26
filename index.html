<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#193e33">
  <title>מדריך הטיול</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #193e33; background: #fbfaf6; font: 18px/1.6 system-ui,sans-serif; }
    main { max-width: 32rem; margin: 18vh auto; padding: 0 24px; }
    h1 { font-size: 1.6rem; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    @supports (height: 100dvh) { iframe { height: 100dvh; } }
  </style>
</head>
<body>
  <main role="status"><h1 id="status">פותח את מדריך הטיול…</h1><p id="hint"></p></main>
  <noscript>יש להפעיל JavaScript בדפדפן כדי לפתוח את המדריך.</noscript>
  <script>
    async function openGuide() {
      const encoded = new URLSearchParams(location.hash.slice(1)).get('k');
      if (!encoded || !/^[A-Za-z0-9_-]{43}$/.test(encoded)) {
        document.getElementById('status').textContent = 'נדרש הקישור המלא';
        document.getElementById('hint').textContent = 'כדי לפתוח את המדריך, לחצו על הקישור המקורי או סרקו את הקוד שקיבלתם.';
        return;
      }
      try {
        const raw = atob(encoded.replace(/-/g,'+').replace(/_/g,'/') + '=');
        const key = await crypto.subtle.importKey('raw', Uint8Array.from(raw, char => char.charCodeAt(0)), 'AES-GCM', false, ['decrypt']);
        const response = await fetch('./guide.bin', {credentials: 'omit', referrerPolicy: 'no-referrer'});
        if (!response.ok) throw Error('Download failed');
        const data = new Uint8Array(await response.arrayBuffer());
        const content = await crypto.subtle.decrypt({name:'AES-GCM', iv:data.subarray(0,12)}, key, data.subarray(12));
        const frame = document.createElement('iframe');
        frame.title = 'מדריך הטיול';
        frame.allow = 'web-share; clipboard-write';
        frame.referrerPolicy = 'no-referrer';
        frame.srcdoc = new TextDecoder().decode(content);
        document.body.replaceChildren(frame);
      } catch {
        document.getElementById('status').textContent = 'המדריך לא נטען';
        document.getElementById('hint').textContent = 'בדקו שיש חיבור לאינטרנט ופתחו שוב את הקישור המקורי במלואו.';
      }
    }
    openGuide();
  </script>
</body>
</html>
